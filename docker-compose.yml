services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: australian_helper
      POSTGRES_USER: helper
      POSTGRES_PASSWORD: helper
    ports: ["5432:5432"]
    volumes: ["helper-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["helper-redis:/data"]
volumes:
  helper-postgres:
  helper-redis:
